services:
  db:
    image: postgres:16
    container_name: iso27001_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Persiste los datos entre reinicios del contenedor
      - pgdata:/var/lib/postgresql/data
      # Scripts que se ejecutan automaticamente la PRIMERA vez que arranca la base.
      # Postgres corre en orden alfabetico todo lo que encuentre aca.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
